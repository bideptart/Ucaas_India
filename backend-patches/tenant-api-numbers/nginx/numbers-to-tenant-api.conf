# Add these INSIDE the `server_name api.ucaas.in;` block in
# /etc/nginx/conf.d/ucaas-in.conf, above the catch-all `location / { ... }`.
#
# `^~` stops nginx considering regex locations once one of these matches, so
# these three win over the catch-all that sends everything else to default-api
# on :3000. /api/numbers/list is deliberately NOT here — it already works on
# default-api and moving it would be a behaviour change this patch does not need.

location ^~ /api/numbers/register {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header X-ORG-ID          $http_x_org_id;
}

location ^~ /api/numbers/release {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header X-ORG-ID          $http_x_org_id;
}

location ^~ /api/numbers/trunk/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header X-ORG-ID          $http_x_org_id;
}
